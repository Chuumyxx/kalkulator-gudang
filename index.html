<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1413" media="(prefers-color-scheme: dark)">
<title>Kalkulator Gudang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f5f4;--card:#fff;--ink:#12201e;--mut:#5b6b68;--line:#d5dedc;--acc:#0f766e;--acc-ink:#fff;--soft:#e3f1ee;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0b1413;--card:#13201e;--ink:#e6f0ee;--mut:#9ab0ac;--line:#27403c;--acc:#2dd4bf;--acc-ink:#04201c;--soft:#173430;--danger:#f97066}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px 10px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
h1{margin:0;text-align:center;font-size:19px;letter-spacing:.08em}
h3{margin:0;font-size:16px}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 8px;height:44px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.namarow{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.namarow select{font-weight:700;flex:1}
.pill{flex:none;font-size:13px;font-weight:700;color:var(--acc);background:var(--soft);border-radius:999px;padding:6px 10px;white-space:nowrap}
.pill.edit{background:var(--acc);color:var(--acc-ink)}
.row{padding:8px 0;border-top:1px solid var(--line)}
.rtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.no{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--acc);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;color:var(--mut);font-family:inherit;font-weight:700;font-size:14px;padding:0 14px;height:36px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.rt{margin-left:auto;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:1fr 14px 1fr 14px 1fr 14px 1fr;align-items:center}
.op{font-style:normal;text-align:center;color:var(--mut);font-weight:700}
.boxes input{text-align:center;padding:0 2px}
.tbar{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:6px}
.tbar span{font-weight:700}
.tbar b{font-size:24px;font-variant-numeric:tabular-nums}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.02em;padding:0 4px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.wa{background:#25d366;color:#06361a;border-color:#25d366}
.btn.ghost{background:transparent}
.btn.dng{color:var(--danger)}
.btn.sm{height:38px;font-size:13px}
.keluar{grid-column:2}
.shead{display:flex;align-items:center;justify-content:space-between}
.srow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow b{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{background:var(--soft);color:var(--acc);font-size:13px;padding:7px 8px;text-align:left}
td{padding:5px 4px;border-top:1px solid var(--line);font-weight:600;font-size:14px}
td input{height:38px;text-align:center}
td:nth-child(2){width:84px}td:nth-child(3){width:34px}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;width:30px;height:30px;cursor:pointer}
.kadd{display:grid;grid-template-columns:1fr 70px 46px;gap:6px;margin-top:8px}
.kadd input{height:40px}.kadd .btn{height:40px;font-size:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#dlg{z-index:30;align-items:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:14px;max-height:85vh;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.dlgbox{border-radius:16px;margin:0 16px;width:calc(100% - 32px)}
.dlgbox p{margin:0;color:var(--mut)}
.dlgbox .bt{display:flex;gap:8px;flex-wrap:wrap}
.dlgbox .bt .btn{flex:1;min-width:90px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px}
.item .in{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.item .in b{font-variant-numeric:tabular-nums}
.item .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.empty{color:var(--mut);text-align:center;padding:6px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
#bye{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
</style>
</head>
<body>
<main class="app">
  <header class="card"><h1>KALKULATOR GUDANG</h1></header>

  <section class="card">
    <div class="namarow"><select id="nama" aria-label="Nama barang"></select><span id="pill" class="pill"></span></div>
    <div id="rows"></div>
    <div class="tbar"><span>Total ikat + ecer</span><b id="grand">0</b></div>
  </section>

  <div class="btns3">
    <button id="bSimpan" class="btn pri" type="button">SIMPAN</button>
    <button id="bManage" class="btn" type="button">KOSONGKAN/EDIT</button>
    <button id="bWA" class="btn wa" type="button">LAPORAN WA</button>
    <button id="bKeluar" class="btn ghost keluar" type="button">KELUAR</button>
  </div>

  <section class="card" id="savedCard" hidden>
    <h3 style="margin-bottom:6px">Tersimpan</h3>
    <div id="sbody"></div>
  </section>

  <section class="card">
    <table>
      <thead><tr><th>Kartu Stok</th><th>Isi ikat</th><th></th></tr></thead>
      <tbody id="kbody"></tbody>
    </table>
    <div class="kadd">
      <input id="kn" placeholder="Barang baru" autocomplete="off" style="text-transform:uppercase">
      <input id="ki" inputmode="numeric" placeholder="Isi" autocomplete="off">
      <button id="kplus" class="btn" type="button" aria-label="Tambah barang">+</button>
    </div>
  </section>
</main>

<div id="ov" class="ov" hidden></div>
<div id="dlg" class="ov" hidden></div>
<div id="toast" hidden></div>
<div id="bye" hidden><h3>Aplikasi ditutup</h3><button id="bBuka" class="btn pri" type="button" style="max-width:200px">BUKA LAGI</button></div>

<script>
(function(){
'use strict';
var KEY='kalkulator-gudang-v1';
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var emptyRow=function(){return {m:'ikat',k:['','','','']};};
var DEF={items:[{n:'DUS DOC',i:50},{n:'DUS HE',i:10},{n:'TRAY KERTAS',i:70}],nama:'DUS DOC',rows:[0,1,2,3,4].map(emptyRow),saved:[],edit:null};
var $=function(s){return document.querySelector(s);};
var fmt=function(n){return Number.isFinite(n)?String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'—';};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

function load(){
  try{
    var j=JSON.parse(localStorage.getItem(KEY));
    if(j&&Array.isArray(j.items)&&j.items.length&&Array.isArray(j.rows)&&j.rows.length===5&&Array.isArray(j.saved)){
      return Object.assign(clone(DEF),j);
    }
  }catch(e){}
  return clone(DEF);
}
var S=load();
if(!S.items.some(function(x){return x.n===S.nama;}))S.nama=S.items[0].n;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- hitungan ---------- */
function isi(){var x=S.items.find(function(x){return x.n===S.nama;});return x?x.i:0;}
function rowTotal(r){
  var v=r.k.filter(function(x){return x!=='';}).map(Number);
  if(!v.length)return 0;
  var t=r.m==='ikat'?v.reduce(function(a,b){return a*b;},1)*isi():v.reduce(function(a,b){return a+b;},0);
  return Number.isSafeInteger(t)?t:NaN;
}
function grand(){return S.rows.reduce(function(a,r){return a+rowTotal(r);},0);}

/* ---------- tampilan ---------- */
function buildRows(){
  var box=$('#rows');box.innerHTML='';
  S.rows.forEach(function(r,ri){
    var el=document.createElement('div');el.className='row';
    var ins='';
    for(var j=0;j<4;j++)ins+=(j?'<i class="op"></i>':'')+'<input inputmode="numeric" maxlength="6" autocomplete="off" data-j="'+j+'" aria-label="Kotak '+(j+1)+'">';
    el.innerHTML='<div class="rtop"><span class="no">'+(ri+1)+'</span><div class="seg"><button type="button" data-m="ikat">Ikat</button><button type="button" data-m="ecer">Ecer</button></div><div class="rt">0</div></div><div class="boxes">'+ins+'</div>';
    box.appendChild(el);
  });
}
function paintRows(){
  document.querySelectorAll('.row').forEach(function(el,ri){
    var r=S.rows[ri];
    el.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===r.m);});
    el.querySelectorAll('.op').forEach(function(o){o.textContent=r.m==='ikat'?'×':'+';});
    el.querySelectorAll('input').forEach(function(inp,j){inp.value=r.k[j];});
  });
}
function calc(){
  document.querySelectorAll('.row').forEach(function(el,ri){el.querySelector('.rt').textContent=fmt(rowTotal(S.rows[ri]));});
  $('#grand').textContent=fmt(grand());
}
function paintPill(){
  var p=$('#pill');
  p.textContent=(S.edit?'EDIT · ':'')+'isi '+fmt(isi());
  p.classList.toggle('edit',!!S.edit);
}
function paintNama(){
  $('#nama').innerHTML=S.items.map(function(x){return '<option value="'+esc(x.n)+'">'+esc(x.n)+'</option>';}).join('');
  $('#nama').value=S.nama;
  paintPill();
}
function paintSaved(){
  $('#savedCard').hidden=!S.saved.length;
  $('#sbody').innerHTML=S.saved.map(function(x){return '<div class="srow"><span>'+esc(x.n)+'</span><b>'+fmt(x.total)+'</b></div>';}).join('');
}
function paintKartu(){
  $('#kbody').innerHTML=S.items.map(function(x,i){
    return '<tr><td>'+esc(x.n)+'</td><td><input inputmode="numeric" maxlength="5" data-ki="'+i+'" value="'+x.i+'" aria-label="Isi ikat '+esc(x.n)+'"></td><td><button class="x" type="button" data-kdel="'+i+'" aria-label="Hapus '+esc(x.n)+'">✕</button></td></tr>';
  }).join('');
}
function render(){paintNama();paintRows();calc();paintSaved();paintKartu();}

var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},1800);}

function ask(title,msg,btns){
  return new Promise(function(res){
    var d=$('#dlg');d.innerHTML='';
    var s=document.createElement('div');s.className='sheet dlgbox';
    s.innerHTML='<h3></h3><p></p><div class="bt"></div>';
    s.querySelector('h3').textContent=title;s.querySelector('p').textContent=msg;
    btns.forEach(function(b){
      var e=document.createElement('button');e.type='button';e.className='btn '+(b.c||'');e.textContent=b.t;
      e.onclick=function(){d.hidden=true;res(b.v);};
      s.querySelector('.bt').appendChild(e);
    });
    d.appendChild(s);d.hidden=false;
    d.onclick=function(ev){if(ev.target===d){d.hidden=true;res(null);}};
  });
}

/* ---------- aksi ---------- */
function kosong(){S.rows=[0,1,2,3,4].map(emptyRow);S.edit=null;paintRows();paintPill();calc();persist();}

async function simpan(){
  var t=grand();
  if(!Number.isFinite(t)){toast('Angka terlalu besar');return;}
  if(t<=0){toast('Isi hitungan dulu');return;}
  var ex=S.saved.find(function(x){return x.n===S.nama;});
  var entry={n:S.nama,total:t,rows:clone(S.rows),isi:isi(),ts:Date.now()};
  if(ex&&S.edit!==S.nama){
    var c=await ask('Sudah tersimpan',S.nama+' : '+fmt(ex.total)+'\nHitungan baru : '+fmt(t),[
      {t:'Timpa',v:'timpa'},{t:'Top Up',v:'top'},{t:'Batal',v:null,c:'ghost'}]);
    if(!c)return;
    if(c==='top'){ex.total+=t;ex.rows=null;ex.ts=Date.now();}
    else Object.assign(ex,entry);
  }else if(ex){Object.assign(ex,entry);}
  else S.saved.push(entry);
  kosong();paintSaved();persist();toast('Tersimpan');
}

async function topUp(i){
  var ex=S.saved[i],t=grand();
  if(!(t>0)){toast('Hitungan masih kosong');return false;}
  var c=await ask('Top Up','Tambah '+fmt(t)+' ke '+ex.n+' ?',[{t:'Ya',v:1},{t:'Batal',v:0,c:'ghost'}]);
  if(!c)return false;
  ex.total+=t;ex.rows=null;ex.ts=Date.now();
  kosong();paintSaved();persist();toast('Top Up berhasil');
  return true;
}
async function editItem(i){
  var ex=S.saved[i];
  if(grand()>0){
    var c=await ask('Ganti hitungan?','Hitungan di layar akan diganti.',[{t:'Ya, edit',v:1},{t:'Batal',v:0,c:'ghost'}]);
    if(!c)return false;
  }
  if(!S.items.some(function(x){return x.n===ex.n;}))S.items.push({n:ex.n,i:ex.isi||0});
  S.nama=ex.n;
  if(ex.rows)S.rows=clone(ex.rows);
  else{S.rows=[0,1,2,3,4].map(emptyRow);S.rows[0]={m:'ecer',k:[String(ex.total),'','','']};}
  S.edit=ex.n;
  paintNama();paintRows();calc();paintKartu();persist();
  toast('Mode edit : '+ex.n);
  return true;
}
async function hapusItem(i){
  var ex=S.saved[i];
  var c=await ask('Hapus','Hapus '+ex.n+' ('+fmt(ex.total)+') ?',[{t:'Hapus',v:1,c:'dng'},{t:'Batal',v:0,c:'ghost'}]);
  if(!c)return;
  S.saved.splice(i,1);
  if(S.edit===ex.n)S.edit=null;
  paintSaved();paintPill();persist();toast('Dihapus');
}
async function hapusSemua(){
  var c=await ask('Hapus semua','Semua data tersimpan dihapus.',[{t:'Hapus semua',v:1,c:'dng'},{t:'Batal',v:0,c:'ghost'}]);
  if(!c)return;
  S.saved=[];S.edit=null;paintSaved();paintPill();persist();toast('Semua dihapus');
}

function closeManage(){$('#ov').hidden=true;}
function openManage(){
  var o=$('#ov');o.innerHTML='';
  var s=document.createElement('div');s.className='sheet';
  var list=S.saved.length?S.saved.map(function(x,i){
    return '<div class="item"><div class="in"><span>'+esc(x.n)+'</span><b>'+fmt(x.total)+'</b></div><div class="acts"><button class="btn sm" type="button" data-a="top" data-i="'+i+'">Top Up</button><button class="btn sm" type="button" data-a="edit" data-i="'+i+'">Edit</button><button class="btn sm dng" type="button" data-a="del" data-i="'+i+'">Hapus</button></div></div>';
  }).join(''):'<div class="empty">Belum ada data tersimpan</div>';
  s.innerHTML='<div class="shead"><h3>Kosongkan / Edit</h3><button class="x" type="button" data-a="close" aria-label="Tutup">✕</button></div>'+
    '<button class="btn ghost" type="button" data-a="kosong">KOSONGKAN HITUNGAN</button>'+list+
    (S.saved.length?'<button class="btn ghost dng" type="button" data-a="delall">HAPUS SEMUA</button>':'');
  o.appendChild(s);o.hidden=false;
  o.onclick=async function(ev){
    if(ev.target===o){closeManage();return;}
    var b=ev.target.closest('button');if(!b)return;
    var a=b.dataset.a,i=+b.dataset.i;
    if(a==='close')closeManage();
    else if(a==='kosong'){kosong();closeManage();toast('Hitungan dikosongkan');}
    else if(a==='top'){await topUp(i);openManage();}
    else if(a==='edit'){if(await editItem(i))closeManage();}
    else if(a==='del'){await hapusItem(i);openManage();}
    else if(a==='delall'){await hapusSemua();openManage();}
  };
}

function laporan(){
  if(!S.saved.length){toast('Belum ada data tersimpan');return;}
  var d=new Date();
  var tgl=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jayapura'}).format(d);
  var jam=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Asia/Jayapura'}).format(d);
  var baris=S.saved.map(function(x,i){return (i+1)+'. '+x.n+' : *'+fmt(x.total)+'*';}).join('\n');
  var teks='*LAPORAN STOK GUDANG*\nHatchery Jayapura\n'+tgl+', '+jam+' WIT\n\n'+baris;
  var url='https://wa.me/?text='+encodeURIComponent(teks);
  var w=window.open(url,'_blank');
  if(!w)location.href=url;
}

async function keluar(){
  var c=await ask('Keluar','Data sudah tersimpan otomatis.',[{t:'Keluar',v:1},{t:'Batal',v:0,c:'ghost'}]);
  if(!c)return;
  persist();
  try{window.close();}catch(e){}
  $('#bye').hidden=false;
}

/* ---------- event ---------- */
var rowsBox=$('#rows');
rowsBox.addEventListener('input',function(ev){
  var inp=ev.target;if(inp.tagName!=='INPUT')return;
  var ri=Array.prototype.indexOf.call(rowsBox.children,inp.closest('.row'));
  var v=inp.value.replace(/\D/g,'');
  if(v!==inp.value)inp.value=v;
  S.rows[ri].k[+inp.dataset.j]=v;
  calc();persist();
});
rowsBox.addEventListener('focusin',function(ev){if(ev.target.tagName==='INPUT')setTimeout(function(){try{ev.target.select();}catch(e){}},0);});
rowsBox.addEventListener('click',function(ev){
  var b=ev.target.closest('.seg button');if(!b)return;
  var ri=Array.prototype.indexOf.call(rowsBox.children,b.closest('.row'));
  S.rows[ri].m=b.dataset.m;paintRows();calc();persist();
});
$('#nama').addEventListener('change',function(){S.nama=this.value;S.edit=null;paintPill();calc();persist();});

$('#kbody').addEventListener('input',function(ev){
  var inp=ev.target;if(inp.dataset.ki===undefined)return;
  var v=inp.value.replace(/\D/g,'');if(v!==inp.value)inp.value=v;
  S.items[+inp.dataset.ki].i=v===''?0:parseInt(v,10);
  paintPill();calc();persist();
});
$('#kbody').addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-kdel]');if(!b)return;
  if(S.items.length<=1){toast('Minimal 1 barang');return;}
  var i=+b.dataset.kdel,n=S.items[i].n;
  var c=await ask('Hapus barang','Hapus '+n+' dari Kartu Stok?',[{t:'Hapus',v:1,c:'dng'},{t:'Batal',v:0,c:'ghost'}]);
  if(!c)return;
  S.items.splice(i,1);
  if(S.nama===n){S.nama=S.items[0].n;S.edit=null;}
  paintNama();paintKartu();calc();persist();
});
$('#ki').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'');});
$('#kplus').addEventListener('click',function(){
  var n=$('#kn').value.trim().toUpperCase().replace(/\s+/g,' ');
  var v=parseInt($('#ki').value,10);
  if(!n){toast('Isi nama barang');return;}
  if(!(v>0)){toast('Isi ikat harus lebih dari 0');return;}
  if(S.items.some(function(x){return x.n===n;})){toast('Barang sudah ada');return;}
  S.items.push({n:n,i:v});
  $('#kn').value='';$('#ki').value='';
  paintNama();paintKartu();persist();toast('Barang ditambah');
});

$('#bSimpan').addEventListener('click',simpan);
$('#bManage').addEventListener('click',openManage);
$('#bWA').addEventListener('click',laporan);
$('#bKeluar').addEventListener('click',keluar);
$('#bBuka').addEventListener('click',function(){$('#bye').hidden=true;});

buildRows();render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
</script>
</body>
</html>
